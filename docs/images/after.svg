<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="Inter, 'Segoe UI', 'Noto Sans', sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5b8c"/>
      <stop offset="1" stop-color="#e9a46b"/>
    </linearGradient>
    <clipPath id="photo"><rect x="640" y="150" width="190" height="160"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#46c37b"/>
    </marker>
  </defs>

  <rect width="960" height="660" rx="18" fill="#101116"/>
  <rect x="30" y="22" width="84" height="30" rx="15" fill="#123222"/>
  <text x="72" y="42" fill="#6fe0a0" font-size="15" font-weight="700" text-anchor="middle">AFTER</text>
  <text x="132" y="42" fill="#b9bdc9" font-size="15">Floating viewer you drag with the mouse, chat stays usable</text>

  <!-- monitor A: chat -->
  <rect x="40" y="70" width="420" height="300" rx="12" fill="#1c1e26" stroke="#2e313d" stroke-width="2"/>
  <rect x="54" y="84" width="392" height="272" rx="4" fill="#17212b"/>
  <rect x="54" y="84" width="120" height="272" rx="4" fill="#1d2833"/>
  <g fill="#2b3a49">
    <circle cx="76" cy="110" r="11"/><rect x="94" y="104" width="66" height="7" rx="3.5"/><rect x="94" y="115" width="46" height="6" rx="3"/>
    <circle cx="76" cy="148" r="11"/><rect x="94" y="142" width="56" height="7" rx="3.5"/><rect x="94" y="153" width="66" height="6" rx="3"/>
  </g>
  <rect x="192" y="110" width="150" height="28" rx="10" fill="#22303d"/>
  <rect x="260" y="150" width="170" height="28" rx="10" fill="#2b5278"/>
  <rect x="192" y="190" width="120" height="28" rx="10" fill="#22303d"/>
  <rect x="290" y="230" width="140" height="28" rx="10" fill="#2b5278"/>
  <rect x="184" y="316" width="252" height="30" rx="8" fill="#22303d" stroke="#46c37b" stroke-width="1.5"/>
  <rect x="196" y="327" width="90" height="8" rx="4" fill="#5b6b7b"/>
  <rect x="290" y="323" width="2" height="16" fill="#e6e6e6"/>
  <rect x="210" y="370" width="80" height="18" fill="#1c1e26"/>
  <rect x="180" y="386" width="140" height="8" rx="4" fill="#2e313d"/>

  <!-- monitor B: floating viewer -->
  <rect x="500" y="70" width="420" height="300" rx="12" fill="#1c1e26" stroke="#2e313d" stroke-width="2"/>
  <rect x="514" y="84" width="392" height="272" rx="4" fill="#191b22"/>
  <g fill="#232633">
    <rect x="528" y="100" width="170" height="240" rx="6"/>
  </g>
  <rect x="600" y="112" width="270" height="226" rx="8" fill="#1f1f22" stroke="#46c37b" stroke-width="2"/>
  <g clip-path="url(#photo)">
    <rect x="640" y="150" width="190" height="160" fill="url(#sky)"/>
    <circle cx="785" cy="210" r="17" fill="#ffd89a"/>
    <path d="M640 310 L690 240 L725 275 L770 222 L830 300 L830 310 Z" fill="#2c3e57"/>
    <path d="M640 310 L675 285 L705 300 L750 270 L795 300 L830 288 L830 310 Z" fill="#1d2a3c"/>
  </g>
  <g fill="#cfcfcf" font-size="13" text-anchor="middle">
    <text x="812" y="131">–</text>
    <rect x="829" y="122" width="9" height="9" fill="none" stroke="#cfcfcf" stroke-width="1.3"/>
    <text x="857" y="132">×</text>
  </g>
  <path d="M616 126 l0 18 l5 -5 l4 9 l3 -1.5 l-4 -9 l7 0 Z" fill="#fff" stroke="#000" stroke-width="1"/>
  <rect x="710" y="370" width="80" height="18" fill="#1c1e26"/>
  <rect x="680" y="386" width="140" height="8" rx="4" fill="#2e313d"/>

  <!-- drag path from monitor A to B -->
  <rect x="300" y="196" width="120" height="100" rx="6" fill="none" stroke="#46c37b" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7"/>
  <path d="M420 230 C 470 200, 540 160, 594 150" stroke="#46c37b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>

  <!-- callouts -->
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#fff">
    <circle cx="884" cy="324" r="13" fill="#2f9e5e"/><text x="884" y="329">1</text>
    <circle cx="500" cy="180" r="13" fill="#2f9e5e"/><text x="500" y="185">2</text>
    <circle cx="170" cy="331" r="13" fill="#2f9e5e"/><text x="170" y="336">3</text>
    <circle cx="884" cy="98" r="13" fill="#2f9e5e"/><text x="884" y="103">4</text>
  </g>

  <!-- legend -->
  <g font-size="15" fill="#d7dae3">
    <circle cx="80" cy="460" r="11" fill="#2f9e5e"/><text x="80" y="465" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">1</text>
    <text x="102" y="465">A real floating window, always above tiled windows. No keybinds needed.</text>
    <circle cx="80" cy="490" r="11" fill="#2f9e5e"/><text x="80" y="495" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <text x="102" y="495">Hold the left mouse button on the dark area and drag, even to another monitor.</text>
    <circle cx="80" cy="520" r="11" fill="#2f9e5e"/><text x="80" y="525" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <text x="102" y="525">Click the chat and keep typing while the photo stays open next to it.</text>
    <circle cx="80" cy="550" r="11" fill="#2f9e5e"/><text x="80" y="555" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">4</text>
    <text x="102" y="555">Next photo opens on the same monitor, at the same spot and size.</text>
    <text x="80" y="610" fill="#8a8f9c" font-size="13">No flicker: nothing moves the window after it opens, and nobody fights Telegram.</text>
  </g>
</svg>
